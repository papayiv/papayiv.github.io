---
layout: default
title: Posts
permalink: /posts/
---

<div class="posts-header">
  <h1>Posts</h1>
</div>

<ul class="post-list">
  {% for post in site.posts %}
    <li class="post-card">
      <div class="post-date">{{ post.date | date: "%Y-%m-%d" }}</div>
      <h2><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
      {% if post.excerpt %}
        <p class="post-excerpt">{{ post.excerpt | strip_html | truncatewords: 30 }}</p>
      {% endif %}
    </li>
  {% endfor %}
</ul>
