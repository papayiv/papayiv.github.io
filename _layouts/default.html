<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <!-- Основной стиль темы Hacker -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@primer/css@21.10.1/dist/primer.css">
  <!-- Стили подсветки кода (Rouge) -->
  <style>
    /* Стили для Rouge-подсветки — темная тема в духе Hacker */
    .highlight {
      background: #0d1117;
      color: #e6edf3;
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
      margin: 1.2rem 0;
    }
    .highlight pre { margin: 0; }
    .highlight .hll { background-color: #2a2f3a; }
    .highlight .c  { color: #8b949e; font-style: italic; } /* Comment */
    .highlight .err { color: #f85149; } /* Error */
    .highlight .k  { color: #ff7b72; } /* Keyword */
    .highlight .o  { color: #ff7b72; } /* Operator */
    .highlight .p  { color: #c9d1d9; } /* Punctuation */
    .highlight .ch { color: #8b949e; font-style: italic; } /* Comment.Hashbang */
    .highlight .cm { color: #8b949e; font-style: italic; } /* Comment.Multiline */
    .highlight .cp { color: #79c0ff; } /* Comment.Preproc */
    .highlight .cpf { color: #8b949e; font-style: italic; } /* Comment.PreprocFile */
    .highlight .c1 { color: #8b949e; font-style: italic; } /* Comment.Single */
    .highlight .cs { color: #8b949e; font-style: italic; } /* Comment.Special */
    .highlight .gd { color: #f85149; background-color: #491212; } /* Generic.Deleted */
    .highlight .ge { font-style: italic; } /* Generic.Emph */
    .highlight .gr { color: #f85149; } /* Generic.Error */
    .highlight .gh { color: #79c0ff; font-weight: bold; } /* Generic.Heading */
    .highlight .gi { color: #56d364; background-color: #122d12; } /* Generic.Inserted */
    .highlight .go { color: #8b949e; } /* Generic.Output */
    .highlight .gp { color: #79c0ff; font-weight: bold; } /* Generic.Prompt */
    .highlight .gs { font-weight: bold; } /* Generic.Strong */
    .highlight .gu { color: #79c0ff; font-weight: bold; } /* Generic.Subheading */
    .highlight .gt { color: #f85149; } /* Generic.Traceback */
    .highlight .kc { color: #79c0ff; } /* Keyword.Constant */
    .highlight .kd { color: #ff7b72; } /* Keyword.Declaration */
    .highlight .kn { color: #ff7b72; } /* Keyword.Namespace */
    .highlight .kp { color: #79c0ff; } /* Keyword.Pseudo */
    .highlight .kr { color: #ff7b72; } /* Keyword.Reserved */
    .highlight .kt { color: #d2a8ff; } /* Keyword.Type */
    .highlight .m  { color: #a5d6ff; } /* Literal.Number */
    .highlight .s  { color: #a5d6ff; } /* Literal.String */
    .highlight .na { color: #c9d1d9; } /* Name.Attribute */
    .highlight .nb { color: #c9d1d9; } /* Name.Builtin */
    .highlight .nc { color: #d2a8ff; } /* Name.Class */
    .highlight .no { color: #79c0ff; } /* Name.Constant */
    .highlight .nd { color: #d2a8ff; } /* Name.Decorator */
    .highlight .ni { color: #c9d1d9; } /* Name.Entity */
    .highlight .ne { color: #f85149; } /* Name.Exception */
    .highlight .nf { color: #d2a8ff; } /* Name.Function */
    .highlight .nl { color: #c9d1d9; } /* Name.Label */
    .highlight .nn { color: #d2a8ff; } /* Name.Namespace */
    .highlight .nt { color: #7ee787; } /* Name.Tag */
    .highlight .nv { color: #79c0ff; } /* Name.Variable */
    .highlight .ow { color: #ff7b72; } /* Operator.Word */
    .highlight .w  { color: #6e7681; } /* Text.Whitespace */
    .highlight .mb { color: #a5d6ff; } /* Literal.Number.Bin */
    .highlight .mf { color: #a5d6ff; } /* Literal.Number.Float */
    .highlight .mh { color: #a5d6ff; } /* Literal.Number.Hex */
    .highlight .mi { color: #a5d6ff; } /* Literal.Number.Integer */
    .highlight .mo { color: #a5d6ff; } /* Literal.Number.Oct */
    .highlight .sa { color: #a5d6ff; } /* Literal.String.Affix */
    .highlight .sb { color: #a5d6ff; } /* Literal.String.Backtick */
    .highlight .sc { color: #a5d6ff; } /* Literal.String.Char */
    .highlight .dl { color: #a5d6ff; } /* Literal.String.Delimiter */
    .highlight .sd { color: #8b949e; } /* Literal.String.Doc */
    .highlight .s2 { color: #a5d6ff; } /* Literal.String.Double */
    .highlight .se { color: #79c0ff; } /* Literal.String.Escape */
    .highlight .sh { color: #79c0ff; } /* Literal.String.Heredoc */
    .highlight .si { color: #a5d6ff; } /* Literal.String.Interpol */
    .highlight .sx { color: #a5d6ff; } /* Literal.String.Other */
    .highlight .sr { color: #79c0ff; } /* Literal.String.Regex */
    .highlight .s1 { color: #a5d6ff; } /* Literal.String.Single */
    .highlight .ss { color: #79c0ff; } /* Literal.String.Symbol */
    .highlight .bp { color: #c9d1d9; } /* Name.Builtin.Pseudo */
    .highlight .fm { color: #d2a8ff; } /* Name.Function.Magic */
    .highlight .vc { color: #79c0ff; } /* Name.Variable.Class */
    .highlight .vg { color: #79c0ff; } /* Name.Variable.Global */
    .highlight .vi { color: #79c0ff; } /* Name.Variable.Instance */
    .highlight .vm { color: #79c0ff; } /* Name.Variable.Magic */
    .highlight .il { color: #a5d6ff; } /* Literal.Number.Integer.Long */
  </style>
  <!-- Custom layout -->
  <style>
    body {
      max-width: 800px;
      margin: auto;
      padding: 2rem;
      background: #010409;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    h1, h2, h3, h4, h5, h6 {
      color: #58a6ff;
      border-bottom: none;
    }
    a {
      color: #58a6ff;
    }
    img {
      max-width: 100%;
      border-radius: 6px;
    }
  </style>
  <!-- MathJax -->
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        processEnvironments: true
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
      }
    };
  </script>
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <div class="container-lg px-3 my-5 markdown-body">
    {{ content }}
  </div>
</body>
</html>
